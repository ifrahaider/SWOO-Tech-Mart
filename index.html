<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Bar Section</title>
    <!-- FontAwesome for the dropdown chevron icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f4f5f7; /* Light grey page background */
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        .swoo-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 40px;
            background-color: #ffffff; /* White card/bar background */
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #3f3f3f;
            width: 85%; /* Restricts width so grey background shows on sides */
            max-width: 1400px;
            border-radius: 8px; /* Optional: rounds the bar slightly if desired, or remove */
            box-sizing: border-box;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hotline-tag {
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .hotline-number {
            font-weight: 700;
            color: #111827;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .top-link {
            text-decoration: none;
            color: #555555;
            font-weight: 500;
        }

        .top-link:hover {
            color: #000;
        }

        .top-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-weight: 500;
            color: #333;
        }

        .top-dropdown i {
            font-size: 10px;
            color: #777;
        }

        .flag-img {
            width: 18px;
            height: 13px;
            border-radius: 2px;
            object-fit: cover;
        }

        .vertical-divider {
            width: 1px;
            height: 14px;
            background-color: #505050;
        }
    </style>
</head>
<body>

    <div class="swoo-top-bar">
        <div class="top-bar-left">
            <span class="hotline-tag">Hotline 24/7</span>
            <span class="hotline-number">(025) 3886 25 16</span>
        </div>
        <div class="top-bar-right">
            <a href="#" class="top-link">Sell on Swoo</a>
            <a href="#" class="top-link">Order Tracking</a>
            <div class="top-dropdown">
                <span>USD</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="vertical-divider"></div>
            <div class="top-dropdown">
                <img src="https://flagcdn.com/w20/us.png" alt="US flag" class="flag-img">
                <span>Eng</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
        </div>
    </div>

</body>
</html>
